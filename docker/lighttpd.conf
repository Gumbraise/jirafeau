var.basedir  = "/www"
var.logdir   = "/var/log/lighttpd"
var.statedir = "/var/lib/lighttpd"

server.port = 80
server.modules = (
    "mod_access",
    "mod_expire",
    "mod_accesslog"
)

include "mod_fastcgi_fpm.conf"

server.username      = "lighttpd"
server.groupname     = "www-data"

server.pid-file      = "/run/lighttpd.pid"
server.errorlog      = var.logdir  + "/error.log"
server.indexfiles    = ("index.php", "index.html", "index.htm")
server.follow-symlink = "enable"
server.document-root = var.basedir
# Kilobytes. Bound requests before they reach PHP-FPM (0 = unlimited).
# Must stay above PHP post_max_size (2M) + multipart overhead for async chunks.
server.max-request-size = 3072

dir-listing.show-header = "disable"
dir-listing.hide-header-file = "enable"
dir-listing.activate = "disable"

static-file.exclude-extensions = (".php")

accesslog.filename   = var.logdir + "/access.log"
url.access-deny = ("~", ".inc")
$HTTP["url"] =~ "^/var-*" {
     url.access-deny = ("")
}
# Block direct web access to local config, installer, and PHP sources under /lib/
# (functions.js.php remains public — loaded by the UI).
$HTTP["url"] =~ "^/lib/" {
    $HTTP["url"] !~ "^/lib/functions\.js\.php$" {
        url.access-deny = ("")
    }
}
$HTTP["url"] =~ "^/install\.php$" {
     url.access-deny = ("")
}

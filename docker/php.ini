date.timezone = UTC
log_errors = true
ignore_repeated_errors = true
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
; Jirafeau uses JS upload progress events, not PHP session upload progress.
; Disable per PHP advisory (unused feature remains a risk surface).
session.upload_progress.enabled = Off
; Classic and async uploads send a single file per request; keep limits tight.
max_file_uploads = 5
max_input_vars = 200
; Chunked uploads are capped by these values (see max_upload_chunk_size_bytes).
post_max_size = 2M
upload_max_filesize = 1M

services:
  web:
    build:
      no_cache: true
      #args:
        # INI: php_debug #change the ini
      context: . # or ../Dockerfile if we put it in the ./docker folder
    volumes:
      - ./jirafeau_data:/data
    environment:
      # Do not commit real secrets. Set ADMIN_PASSWORD in a local .env or CI secret store.
      # If unset/empty, Docker generates a random password and prints it once in the logs.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Passed through from .env when set. Empty values become [] (see jirafeau_parse_csv_env).
      ADMIN_IP: ${ADMIN_IP:-}
      UPLOAD_PASSWORD: ${UPLOAD_PASSWORD:-}
      # Trusted reverse-proxy addresses (Secure cookies / client IP via X-Forwarded-*).
      PROXY_IP: ${PROXY_IP:-}
      WEB_ROOT: ${WEB_ROOT:-}
      DEBUG: ${DEBUG:-0}
      #LANG: en
      #STYLE: 'my_jirafeau_theme'
      #DARK_STYLE: 'my_jirafeau_theme'
      AVAILABILITIES: |
        {
          "minute": true,
          "hour": true,
          "day": true,
          "week": true,
          "fortnight": true,
          "month": true,
          "quarter": false,
          "year": false,
          "none": false
        }
    ports:
      - 8080:80

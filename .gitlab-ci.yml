stages:
  - test
  - lint
  - deploy

default:
  tags:
    - k8s-cev-components

# Select what we should cache
cache:
  paths:
    - vendor/

# Aliases and Anchors for reuse

.linter_script: &linter_script
    - ./vendor/bin/parallel-lint --gitlab --exclude vendor .
    - ./vendor/bin/php-cs-fixer -vvv check . --using-cache=no --rules=@PSR12,-single_space_around_construct
.before_script: &before_linter_script
    # Install git, the docker php image doesn't have it installed by default
    - apt-get update -yqq
    - apt-get install git -yqq
    - apt-get install zip -yqq
    # Enable necessary php extensions
    - docker-php-ext-enable curl && docker-php-ext-enable json && docker-php-ext-enable zip && docker-php-ext-enable mbstring && docker-php-ext-enable gd && docker-php-ext-enable pdo_mysql
    # Install composer
    - curl -sS https://getcomposer.org/installer | php
    # Create composer.json file manually, since this is a project without any non-dev dependencies yet
    - php composer.phar require --dev php-parallel-lint/php-parallel-lint
    - php composer.phar require --dev friendsofphp/php-cs-fixer:3.93.1
    # Install all project dependencies
    - php composer.phar install

.enableWarningOnFailure: &linter_warning
  allow_failure:
      exit_codes:
        - 1

# Security / concurrency regression suite (no Composer deps)
job_security_tests:
  stage: test
  image: php:8.3-cli
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - php -v
    - php tests/security/check_php_version.php
    - php tests/security/run.php
    - php tests/security/concurrency_run.php

# Assert the same PHP base line as Dockerfile (php:8.3-fpm-alpine) is patched,
# and that our hardening files are present. No Docker-in-Docker: the k8s runner
# has no docker.sock / privileged DinD.
job_docker_php_version:
  stage: test
  image: php:8.3-fpm-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - php -v
    - php tests/security/check_php_version.php
    - grep -E '^session\.upload_progress\.enabled[[:space:]]*=[[:space:]]*Off' docker/php.ini
    - grep -E '^server\.max-request-size[[:space:]]*=[[:space:]]*[1-9]' docker/lighttpd.conf
    - grep -E '^max_file_uploads[[:space:]]*=' docker/php.ini
    # Load our php.ini and confirm upload_progress is off at runtime.
    - cp docker/php.ini /tmp/jirafeau-php.ini
    - php -c /tmp/jirafeau-php.ini -r 'exit(ini_get("session.upload_progress.enabled") ? 1 : 0);'
    - php -c /tmp/jirafeau-php.ini -r 'echo "upload_progress=", ini_get("session.upload_progress.enabled") ? "On" : "Off", PHP_EOL;'

# Run tests for php:8.5
job_lint_app_85:
  stage: lint
  image: php:8.5
  before_script: *before_linter_script
  script: *linter_script

# Run tests for php:8.4
job_lint_app_84:
  stage: lint
  image: php:8.4
  before_script: *before_linter_script
  script: *linter_script

job_lint_app_83:
  stage: lint
  image: php:8.3
  before_script: *before_linter_script
  script: *linter_script

# Run tests for php:8.2
job_lint_app_82:
  stage: lint
  image: php:8.2
  before_script: *before_linter_script
  script: *linter_script


# =================
# Deprecated ones START
# =================

# Run tests for php:8.1
job_lint_app_81:
  stage: lint
  image: php:8.1
  before_script: *before_linter_script
  script: *linter_script
  <<: *linter_warning
  


# Run tests for php:7.4
job_lint_app_74:
  stage: lint
  image: php:7.4
  before_script: *before_linter_script
  script: *linter_script
  <<: *linter_warning

# =================
# Deprecated ones END
# =================

publish:
  image: docker:24.0.5
  stage: deploy
  services:
    # K8s executor: talk to the DinD service over TCP (not /var/run/docker.sock).
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # Login to GitLab's Docker registry
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Create a new builder instance and switch to it
    - docker buildx create --use
    # Build the image:
    # 1. Build a Docker image for linux/arm/v7, linux/arm64/v8 and linux/amd64
    # 2. Tag it with the current commit tag and "latest"
    # 3. Push it to GitLab's Docker registry
    # --pull ensures the floating php:8.3-fpm-alpine tag picks up engine CVE fixes.
    - docker buildx build --pull --push --platform linux/arm/v7,linux/arm64/v8,linux/amd64 --tag $CI_REGISTRY/$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --tag $CI_REGISTRY/$CI_REGISTRY_IMAGE:latest .
  only:
    - tags
